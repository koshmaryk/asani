version = 3.9.4
runner.dialect = scala3

# --- Code Style ---

# Enforces a maximum line length
maxColumn = 100

# Align settings for better readability with significant indentation
align.preset = most
align.multiline = true
align.openParenCallSite = false
align.openParenDefnSite = false

# Rules for newlines and vertical spacing
newlines.source = "keep" # Respects developer's choice of newlines
newlines.beforeMultiline = "keep"
newlines.afterCurlyLambdaParams = "preserve"

# --- Scala 3 Specifics ---

# How to handle optional braces
rewrite.scala3.removeOptionalBraces = "old" # Removes braces for old syntax, keeps for new
rewrite.scala3.insertEndMarkerMinLines = 3 # Add 'end' markers for longer blocks

# Rewrites for conciseness and modern style
rewrite.rules = [
  SortImports,
  RedundantParens,
  AvoidInfix,
  PreferCurlyFors
]

# --- Other Recommendations ---

# Docstring formatting
docstrings.style = "Asterisk"
docstrings.wrap = "yes"

# Better handling of multiline strings
continuationIndent.defnSite = 2
continuationIndent.callSite = 2